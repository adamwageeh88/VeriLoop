<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriLoop – review AI code changes with evidence (simulated prototype)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23E7E9EC%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#evidence">Skip to checks</a>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  <header class="topbar">
    <button class="brand-home" id="btn-home" title="Back to all tasks">
      <svg class="logo-mark" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="5"/><path d="M5.5 10.5l3 3 6-7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">VeriLoop</span>
    </button>
    <span class="sim-tag" title="The assistant, test area and results are scripted. No model or code is run.">Simulated</span>
    <div class="menu-wrap" id="tasks-wrap">
      <button class="crumb-btn hidden" id="btn-tasks" aria-expanded="false" aria-haspopup="true" title="Switch task"><span id="crumb"></span><span class="caret" aria-hidden="true">▾</span></button>
      <div class="menu left hidden" id="task-menu" role="menu">
        <div class="menu-head"><span>Tasks</span><button class="link-btn" data-home>All tasks</button></div>
        <ul id="scenario-list" class="scenario-list"></ul>
      </div>
    </div>

    <ol class="steps" id="steps" aria-label="Progress">
      <li data-step="1"><span class="n">1</span>Ask for a change</li>
      <li data-step="2"><span class="n">2</span>Read the proposal</li>
      <li data-step="3"><span class="n">3</span>Review the checks</li>
      <li data-step="4"><span class="n">4</span>Decide</li>
    </ol>

    <div class="top-actions">
      <div class="menu-wrap">
        <!-- Always visible: whether the person's real code has changed (visibility of system state, L06) -->
        <button class="top-btn code-btn" id="btn-code" aria-expanded="false" aria-haspopup="true"><span class="code-dot" aria-hidden="true"></span><span id="workspace-status">Your code: unchanged</span></button>
        <div class="menu pop hidden" id="code-pop">
          <h3>Your code</h3>
          <p class="repo"><span class="mono">shopkit</span> on <span class="mono">main</span></p>
          <ol id="checkpoints" class="checkpoints"></ol>
          <p class="empty" id="cp-empty">Nothing has been applied yet.</p>
          <div id="rules-panel">
            <h3>Rules you've set</h3>
            <ul id="rules" class="rules"></ul>
          </div>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="top-btn" id="btn-menu" aria-expanded="false" aria-haspopup="true">Menu</button>
        <div class="menu hidden" id="menu" role="menu">
          <div class="view-switch" role="radiogroup" aria-label="View">
            <span class="menu-label">View</span>
            <button class="seg" data-condition="evidence" role="radio" aria-checked="true">Evidence</button>
            <button class="seg" data-condition="baseline" role="radio" aria-checked="false">Baseline</button>
          </div>
          <button class="menu-item" id="btn-capability" role="menuitem">How checks work</button>
          <button class="menu-item" id="btn-settings" role="menuitem">Settings</button>
          <button class="menu-item" id="btn-log" role="menuitem">Study log <span class="count" id="log-count">0</span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="centre">
      <div id="thread" class="thread" aria-live="polite"></div>
      <div id="diff" class="diff hidden" aria-label="Proposed change"></div>
      <div id="composer" class="composer hidden">
        <textarea id="prompt" rows="2" aria-label="Your request to the assistant" readonly></textarea>
        <button type="button" id="send" class="btn primary">Send</button>
      </div>
    </section>

    <aside class="evidence" id="evidence" tabindex="-1" aria-label="Checks"></aside>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box"><div id="modal-body"></div></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="js/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
